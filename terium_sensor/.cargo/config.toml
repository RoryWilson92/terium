# Classic ESP32, with ESP-IDF providing the standard library.
[build]
target = "xtensa-esp32-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
# Match the 64-bit time_t in this ESP-IDF version.
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v6.0.3"
ESP_IDF_TOOLS_INSTALL_DIR = "global"
