[package]
name = "terium_sensor"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"

# Prefer a smaller image over a faster one. It has to fit the app partition.
[profile.release]
opt-level = "s"

[dependencies]
anyhow = "1"
esp-idf-svc = "0.53"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml-cfg = "0.2"

[build-dependencies]
embuild = { version = "0.33.5", features = ["espidf"] }
